<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Smart Insight</title>
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="assets/logo.png" alt="Logo">
        </div>
        <div class="container-navbar">
            <div class="navbar">
                <a href="home.html">Home</a>
                <a href="home.html">Quem somos</a>
                <a href="calculadora.html">Calculadora</a>
                <a href="home.html">Contato</a>
            </div>
            <div class="user">
                <a href="login.html"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
    </div>
    <div class="login">

        <div class="container">
            <div class="card-login">
                <h2>Login</h2>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

            </div>
        </div>
    </div>

    <div id="div_msg" class="alerta"></div>

    <footer class="footer">
        <div class="footer-logo">
            <img src="assets/logo.png" alt="Logo">
        </div>
        <div class="footer-text">
            <p>© Smart Insight</p>
            <p>2026</p>
        </div>
        <div class="footer-social">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
    </footer>
</body>

</html>




<script>
    function entrar() {
        let senha = senha_input.value;
        let email = email_input.value;

        let verificacao = false;

        let div = div_msg;

        // limpa antes
        div.innerHTML = "";

        let termina_com = email.endsWith('.com');
        let indice_arroba = email.indexOf('@');

        if (senha.length < 8) {
            div.style.display = "block";
            div.innerHTML = "❌senha inválida!";
            return;
        }
        else if (indice_arroba == -1 || !termina_com) {
            div.style.display = "block";
            div.innerHTML = "❌ Email inválido!";
            return;
        }

        console.log("FORM LOGIN: ", email);
        console.log("FORM SENHA: ", senha);

        verificacao = true;

        if(verificacao) {
            fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        
                        sessionStorage.TIPO_USUARIO = json.tipo_usuario;
                        sessionStorage.ID_USUARIO = json.id; 

                        alert('Login realizado! Direcionando para tela inicial!');

                        setTimeout(function () {
                            window.location = "painelLoja.html";
                        }, 1000); 

                    });

                } else {
                    console.log("Houve um erro ao tentar realizar o login!");
                    
                    resposta.text().then(texto => {
                        console.error(texto);
                        alert("Email e/ou senha inválidos. Tente novamente!"); 
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })

            return false;
        }
    }
</script>
