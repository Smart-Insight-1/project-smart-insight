<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário | Smart Insight</title>
    <link rel="stylesheet" href="css/headerFooter.css">
    <link rel="stylesheet" href="css/formulario.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="assets/logo.png" alt="Logo">
        </div>
        <div class="container-navbar">
            <div class="navbar">
                <a href="index.html">Home</a>
                <a href="index.html">Quem somos</a>
                <a href="calculadora.html">Calculadora</a>
                <a href="index.html">Contato</a>
            </div>
            <div class="user">
                <a href="login.html"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
    </div>
    <div class="login">

        <div class="container">
            <div class="card-login">
                <h2>Formulário Empresa</h2>
                <div class="formulario">

                    <div class="parte1" style="display: block;">
                        <div class="campo">
                            <span>Razão social:</span>
                            <input id="ipt_razao_social" type="text" placeholder="Nome Oficial da Loja Ltda">
                        </div>
                        <div class="campo">
                            <span>CNPJ:</span>
                            <input id="ipt_cnpj_empresa" type="text" placeholder="Insira o CNPJ da empresa">
                        </div>
                        <button class="botao" onclick="mudarEtapa(1, 2)">Próxima</button>

                    </div>


                    <div class="parte2" style="display: none;">
                        <h3>Insira os dados para a primeira Loja:</h3>
                        <div class="campo">
                            <span>Nome:</span>
                            <input id="ipt_nome_loja" type="text" placeholder="Insira o nome da loja">
                        </div>
                        <div class="campo">
                            <span>CNPJ:</span>
                            <input id="ipt_cnpj_loja" type="text" placeholder="Insira o CNPJ da loja">
                        </div>
                        <button class="botao" onclick="mudarEtapa(2, 3)">Próxima</button>
                        <button class="botao" onclick="mudarEtapa(2, 1)" style="margin-top: 20px;">Voltar</button>
                    </div>


                    <div class="parte3" style="display: none;">
                        <h3>Insira os dados do primeiro Gestor:</h3>
                        <div class="campo">
                            <span>Nome:</span>
                            <input id="ipt_nome_gestor" type="text" placeholder="Insira o nome do gestor">
                        </div>
                        <div class="campo">
                            <span>Email:</span>
                            <input id="ipt_email_gestor" type="text" placeholder="Insira o email do gestor">
                        </div>
                        <div class="campo">
                            <span>Senha:</span>
                            <input id="ipt_senha_gestor" type="text" placeholder="Insira a senha do gestor">
                        </div>
                        <div class="campo">
                            <span>Confirmar Senha:</span>
                            <input id="ipt_confirmar_senha" type="text" placeholder="Confirme a senha do gestor">
                        </div>
                        <button class="botao" onclick="solicitarCadastro()">Solicitar Ativação</button>
                        <button class="botao" onclick="mudarEtapa(3, 2)" style="margin-top: 20px;" >Voltar</button>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div id="div_msg" class="alerta"></div>

    <footer class="footer">
        <div class="footer-logo">
            <img src="assets/logo.png" alt="Logo">
        </div>
        <div class="footer-text">
            <p>© Smart Insight</p>
            <p>2026</p>
        </div>
        <div class="footer-social">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
    </footer>
</body>

</html>

<script>

    function mudarEtapa(parteAtual, proximaParte) {
        document.querySelector('.parte' + parteAtual).style.display = 'none';
        document.querySelector('.parte' + proximaParte).style.display = 'block';
    }

    function solicitarCadastro() {

        let razao_social = ipt_razao_social.value;
        let cnpj_empresa = ipt_cnpj_empresa.value;

        let nome_loja = ipt_nome_loja.value;
        let cnpj_loja = ipt_cnpj_loja.value;

        let nome_gestor = ipt_nome_gestor.value;
        let email_gestor = ipt_email_gestor.value;
        let senha_gestor = ipt_senha_gestor.value;

        let confirmarSenha = ipt_confirmar_senha.value;

        let indice_arroba = email_gestor.includes("@");
        let termina_com = email_gestor.endsWith(".com");

        let temEspecial = false;

        let temMaiuscula = senha_gestor != senha_gestor.toLowerCase();
        let temMinuscula = senha_gestor != senha_gestor.toUpperCase();

        let listaCaracter = ["@", "#", "$", "%", "&", "*", "!", "."]

        for (let i = 0; i < listaCaracter.length; i++) {
            if (senha_gestor.includes(listaCaracter[i])) {
                temEspecial = true;
                break;
            }
        }

        if (
            razao_social == "" || cnpj_empresa == "" || nome_loja == "" || cnpj_loja == "" ||
            nome_gestor == "" || email_gestor == "" || senha_gestor == ""
        ) {
            alert("❌ Preencha todos os campos!");
            return;
        } else if (!indice_arroba || !termina_com) {
            alert("❌ Email inválido!");
            return;
        } else if (senha.length < 8) {
            alert("❌ A senha deve ter pelo menos 8 caracteres!");
            return;
        } else if (!temEspecial) {
            alert("❌ A senha precisa ter caractere especial");
            return;
        } else if (!temMaiuscula) {
            alert("❌ A senha precisa ter pelo menos uma letra maiúscula!");
            return;
        } else if (!temMinuscula) {
            alert("❌ A senha precisa ter pelo menos uma letra minúscula!");
            return;
        } else if (cnpj_empresa.length != 14 || cnpj_loja.length != 14) {
            alert("❌ CNPJ inválido!");
            return;
        } else if (senha != confirmarSenha) {
            alert("❌ As senhas não coincidem!");
            return;
        } else {
            alert("✅ Solicitação de ativição encaminhada com sucesso!");
        }

    }
</script>
