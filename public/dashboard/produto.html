<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Smart Insight</title>

    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/produto.css">
    <link rel="stylesheet" href="../css/sair.css">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
</head>

<body onload="listarProduto(); listarSetores()">

    <div class="menu">
        <h2>Painel, Olá <span id="nome_usuario">*</span></h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li id="menuProdutos"><strong><a href="produto.html">Produtos</a></strong></li>
            <li id="menuSetores"><a href="setor.html">Setores</a></li>
            <li id="menuContatos"><a href="contato.html">Contatos</a></li>
            <li><a href="informacao.html">Informações</a></li>
            <li id="menuCadastro"><a href="cadastro.html">Cadastro Usuário</a></li>
            <button1 class="sairBotao"><a href="../index.html">SAIR</a></button1>
        </ul>
    </div>

    <div class="container-produto">

        <div class="lista-produtos">

            <h2>Produtos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Produto</th>
                        <th>Tipo</th>
                        <th>Setor</th>
                        <th>Marca</th>
                    </tr>
                </thead>

                <tbody id="tabela_produtos"> </tbody>

            </table>

        </div>

        <div class="box">

            <h2>Cadastro de Produto</h2>

            <div class="campo">
                <label>Nome do Produto</label>
                <input type="text" placeholder="Digite o nome do produto" id="ipt_nome">
            </div>

            <div class="campo">
                <label>Tipo do Produto</label>
                <input type="text" placeholder="Digite o tipo do produto" id="ipt_tipo">
            </div>

            <div class="campo">
                <label>Código</label>
                <input type="text" placeholder="1351" id="ipt_codigo">
            </div>

            <div class="campo">
                <label>Setor</label>
                <select id="ipt_setor">
                    
                </select>
            </div>

            <div class="campo">
                <label>Marca</label>
                <input type="text" placeholder="Digite a marca" id="ipt_marca">
            </div>

            <button onclick="botao()">Cadastrar Produto</button> <br> <br>

            <div class="container-remover-produto">

                <h1>Remover produto por código:</h1> <br>

                <div class="campo">
                    <input type="text" id="ipt_removerProduto" class="ipt_removerProduto"
                        placeholder="Insira o código do produto"> <br>
                </div>
            </div>
            <button onclick="deletarProduto()">Remover</button>

        </div>

        <div id="div_msg" class="alertas"></div>
    </div>

</body>

</html>

<script>

    const nomeUsuario = sessionStorage.getItem('NOME_USUARIO');

    const idLoja = sessionStorage.getItem('ID_LOJA') || 1

    if (nomeUsuario == undefined || nomeUsuario == null) {
        document.getElementById("nome_usuario").innerHTML = "Usuário";
    } else {
        document.getElementById("nome_usuario").innerHTML = nomeUsuario;
    }

    const tipoUsuario = sessionStorage.getItem('TIPO_USUARIO');

    if (tipoUsuario == "analista" || tipoUsuario == undefined || tipoUsuario == null) {
        document.getElementById("menuProdutos").style.display = "none";
        document.getElementById("menuSetores").style.display = "none";
        document.getElementById("menuContatos").style.display = "none";
        document.getElementById("menuCadastro").style.display = "none";
    }

    function listarSetores() {
         fetch(`/setores/buscarSetorPorLoja/${idLoja}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(function(resposta){

            if(resposta.ok){
                resposta.json().then(function(setores){

                    console.log(setores);
                    document.getElementById('ipt_setor').innerHTML = "";

                    for(let i = 0; i < setores.length; i++){
                        let setor = setores[i];

                        document.getElementById('ipt_setor').innerHTML += `
                            <option value="${setor.ID}">${setor.nome_setor}</option>
                        `;
                    }
                });
            } else {
                console.log("erro ao listar setores")
            }
        })
        .catch(function(erro){
            console.log(erro)
        });
    }

   function listarProduto() {
    fetch(`/produtos/buscarProdutosPorLoja/${idLoja}`)
    .then(function(response) {
        if (response.ok) {
            response.json().then(function(dados) {
                tabela_produtos.innerHTML = "";

                for (let i = 0; i < dados.length; i++) {
                    tabela_produtos.innerHTML += `
                        <tr>
                            <td>${dados[i].cod_produto}</td>
                            <td>${dados[i].nome}</td>
                            <td>${dados[i].tipo_produto}</td>
                            <td>${dados[i].setor}</td>
                            <td>${dados[i].marca}</td>
                        </tr>
                    `
                }
            })
        } else {
            console.error('Erro na API')
        }
    })
    .catch(function(erro) {
        console.error(erro)
    })
}

    function botao() {

        let div = div_msg
        let nomeProd = ipt_nome.value
        let tipoProd = ipt_tipo.value
        let codigo = ipt_codigo.value
        let setor = ipt_setor.value
        let marca = ipt_marca.value

        div.innerHTML = "";
        div.style.display = "block";

        if (codigo.length <= 13 && nomeProd.length != 0 && tipoProd.length != 0 && marca.length != 0 && codigo.length != 0) {

            let id_loja = sessionStorage.getItem('ID_LOJA');

        fetch(`/produtos/inserirProduto/${id_loja}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nome: nomeProd,
                tipoProduto: tipoProd,
                codProduto: codigo,
                marca: marca,
                setor: setor
            })
        })
            .then(function(response) {
                if (response.ok) {
                    div.innerHTML = "✅ cadastro válido!";
                    listarProduto()
                } else {
                    console.error('Erro na API')
                }
            })
            .catch(function(erro) {
                console.error(erro)
            })

        }
        else {
            div.innerHTML = "❌ cadastro inválido!";
        }
    }

    function deletarProduto() {

    let div = div_msg
    let id_loja = sessionStorage.getItem('ID_LOJA');
    let cod_produto = ipt_removerProduto.value;

    div.innerHTML = "";
    div.style.display = "block";

    fetch(`/produtos/deletarProduto/${id_loja}/${cod_produto}`, {
        method: 'DELETE'
    })
        .then(function(response) {
            if (response.ok) {
                div.innerHTML = "✅ produto removido!";
                listarProduto()
            } else {
                console.error('Erro na API:', response)
            }
        })
        .catch(function(erro) {
            console.error(erro)
        })
}
</script>
