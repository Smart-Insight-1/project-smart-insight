    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>

<body>

    <div class="menu">
        <h2>Painel</h2>

        <ul>
            <li><a href="dashboardDiaria.html">Dashboard - Diário</a></li>
            <li><a href="dashboardSemanal.html">Dashboard - Semanal</a></li>
            <li><a href="dashboardMensal.html">Dashboard - Mensal</a></li>
            <li><a href="produto.html">Produtos</a></li>

            <li><a href="cadastro.html">Cadastro Usuário</a></li>
        </ul>
    </div>

    <div class="container-contato">

        <div class="lista-contatos">

            <h2>Contatos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Telefones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>11999999999</td>
                    </tr>

                    <tr>
                        <td>11988888888</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="box">

            <h2>Cadastrar Contato</h2>

            <div class="campo">
                <label>Telefone</label>
                <input type="text" placeholder="11999999999" id="ipt_telefone">
            </div>

            <button onclick="botao()">Cadastrar Contato</button>

        </div>

        <div id="div_msg" class="alertas"></div>
        
    </div>



</body>

</html>

<script>
    function botao() {

        let div = div_msg

        let telefone = ipt_telefone.value

        div.innerHTML = "";
        div.style.display = "block";


        if (telefone.length == 11) {
            div.innerHTML = "✅ cadastro válido!";
        }
        else {
            div.innerHTML = "❌ cadastro inválido!";
        }
    }
</script>
