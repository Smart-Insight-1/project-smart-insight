<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos | Smart Insight</title>

    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/contato.css">
</head>

<body>

    <div class="menu">
        <h2>Painel</h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li id="menuProdutos"><a href="produto.html">Produtos</a></li>
            <li id="menuSetores"><a href="setor.html">Setores</a></li>
            <li id="menuContatos"><strong><a href="contato.html">Contatos</a></strong></li>
            <li><a href="informacao.html">Informações</a></li>
            <li id="menuCadastro"><a href="cadastro.html">Cadastro Usuário</a></li>
        </ul>
    </div>

    <div class="container-contato">

        <div class="lista-contatos">

            <h2>Contatos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Telefones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>11999999999</td>
                    </tr>

                    <tr>
                        <td>11988888888</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="box">

            <h2>Cadastrar Contato</h2>

            <div class="campo">
                <label>Telefone</label>
                <input type="text" placeholder="11999999999" id="ipt_telefone">
            </div>

            <button onclick="botao()">Cadastrar Contato</button>

        </div>

        <div id="div_msg" class="alertas"></div>
        
    </div>



</body>

</html>

<script>

    const nomeUsuario = sessionStorage.getItem('NOME_USUARIO');
    
    if(nomeUsuario == undefined || nomeUsuario == null) {
        document.getElementById("nome_usuario").innerHTML = "Usuário";
    } else {
        document.getElementById("nome_usuario").innerHTML = nomeUsuario;
    }

    const tipoUsuario = sessionStorage.TIPO_USUARIO;

    if(tipoUsuario == "analista" || tipoUsuario == undefined || tipoUsuario == null) {
        document.getElementById("menuProdutos").style.display = "none";
        document.getElementById("menuSetores").style.display = "none";
        document.getElementById("menuContatos").style.display = "none";
        document.getElementById("menuCadastro").style.display = "none";
    }

    function botao() {

        let div = div_msg

        let telefone = ipt_telefone.value

        div.innerHTML = "";
        div.style.display = "block";


        if (telefone.length == 11) {
            div.innerHTML = "✅ cadastro válido!";
        }
        else {
            div.innerHTML = "❌ cadastro inválido!";
        }
    }
</script>
