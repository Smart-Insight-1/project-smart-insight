<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos | Smart Insight</title>

    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/contato.css">
    <link rel="stylesheet" href="../css/sair.css">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
</head>

<body onload="listar()">

    <div class="menu">
        <h2>Painel, Olá <span id="nome_usuario">*</span></h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li id="menuProdutos"><a href="produto.html">Produtos</a></li>
            <li id="menuSetores"><a href="setor.html">Setores</a></li>
            <li id="menuContatos"><strong><a href="contato.html">Contatos</a></strong></li>
            <li><a href="informacao.html">Informações</a></li>
            <li id="menuCadastro"><a href="cadastro.html">Cadastro Usuário</a></li>
            <button1 class="sairBotao"><a href="../index.html">SAIR</a></button1>
        </ul>
    </div>

    <div class="container-contato">

        <div class="lista-contatos">

            <h2>Contatos Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID do Contato</th>
                        <th>Telefones</th>
                    </tr>
                </thead>

                <tbody id="tabela_contatos">

                </tbody>

            </table>

        </div>

        <div class="box">

            <h2>Cadastrar Contato</h2>

            <div class="campo">
                <label>Telefone</label>
                <input type="text" placeholder="11999999999" id="ipt_telefone">
            </div>

            <button onclick="botao()">Cadastrar Contato</button>

            <div class="container-remover-setor">

                <h1>Deletar contato por ID: </h1>

                <div class="campo">
                    <input type="text" id="ipt_removerContato" class="ipt_removerContato"
                        placeholder="Digite o ID do contato">
                </div>
            </div>
            <button onclick="deletar()">Remover</button>

        </div>

        <div id="div_msg" class="alertas"></div>

    </div>



</body>

</html>

<script>

    const nomeUsuario = sessionStorage.getItem('NOME_USUARIO');

    const idUsuario = sessionStorage.getItem('ID_USUARIO') || 1;

    if (nomeUsuario == undefined || nomeUsuario == null) {
        document.getElementById("nome_usuario").innerHTML = "Usuário";
    } else {
        document.getElementById("nome_usuario").innerHTML = nomeUsuario;
    }

    const tipoUsuario = sessionStorage.getItem('TIPO_USUARIO');

    if (tipoUsuario == "analista" || tipoUsuario == undefined || tipoUsuario == null) {
        document.getElementById("menuProdutos").style.display = "none";
        document.getElementById("menuSetores").style.display = "none";
        document.getElementById("menuContatos").style.display = "none";
        document.getElementById("menuCadastro").style.display = "none";
    }

    function listar() {

        fetch(`/contatos/buscarContato/${idUsuario}`, {
            method: "GET",
        })
            .then(function (resposta) {
                resposta.json().then(function (contatos) {

                    let tabela = document.getElementById("tabela_contatos")
                    tabela.innerHTML = ""

                    for (let i = 0; i < contatos.length; i++) {
                        let contato = contatos[i]

                        tabela.innerHTML += `
                        <tr>
                        <td>${contato.id_contato}</td>
                        <td>${contato.telefone}</td>   
                        <tr>
                        `
                    }

                })

            })
            .catch(function (erro) {
                console.log("Houve um erro ao buscar os contatos:", erro);
            });

    }

    function botao() {

        let div = div_msg

        let telefone = ipt_telefone.value

        div.innerHTML = "";
        div.style.display = "block";


        if (telefone.length == 11) {
            div.innerHTML = "✅ cadastro válido!";

            fetch(`/contatos/inserirContato/${idUsuario}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    telefone: telefone
                })
            })
                .then(function (resposta) {
                    console.log(resposta);

                    if (resposta.ok) {
                        div.innerHTML = `✅ Contato cadastrado com sucesso!`;
                    } else {
                        div.innerHTML = `❌ Erro ao cadastrar contato!`
                    }
                })
                .catch(function (erro) {
                    console.log(erro);

                    div.innerHTML = `❌ Erro na comunicação com o servidor!`
                });
        }
        else {
            div.innerHTML = "❌ Insira as informações corretas!";
        }
    }


    function deletar() {

        let div = div_msg

        let idContato = ipt_removerContato.value;


        div.innerHTML = "";


        if (idContato == "") {
            div.innerHTML = `❌ Insira o ID do contato`;
        }

        fetch(`/contatos/deletarContato/${idContato}`, {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        })
            .then(function (resposta) {
                console.log(resposta)

                if (resposta.ok) {
                    alert(`Contato removido com sucesso!`)
                } else {
                    alert(`Erro ao remover contato!`)
                }
            })
            .catch(function (erro) {
                console.log(erro);
            })
    }
</script>
