<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Smart Insight</title>

    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="https://kit.fontawesome.com/d840916580.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="menu">
        <h2>Painel, Olá <span id="nome_usuario">*</span></h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li id="menuProdutos"><a href="produto.html">Produtos</a></li>
            <li id="menuSetores"><a href="setor.html">Setores</a></li>
            <li id="menuContatos"><a href="contato.html">Contatos</a></li>
            <li><a href="informacao.html">Informações</a></li>
            <li id="menuCadastro"><strong><a href="cadastro.html">Cadastro Usuário</a></strong></li>
        </ul>
    </div>

    <div class="container-cadastro">

        <div class="box">

            <h2>Cadastro de Usuário</h2>

            <div class="campo">
                <label>Nome:</label>
                <input type="text" placeholder="Digite o nome do usuário" id="ipt_nome">
            </div>

            <div class="campo">
                <label>Email:</label>
                <input type="text" placeholder="Digite o email do usuário" id="ipt_email">
            </div>

            <div class="campo">
                <label>Senha:</label>
                <input type="text" placeholder="Digite a senha do usuário" id="ipt_senha">
            </div>

            <div class="campo">
                <label>Confirmar Senha:</label>
                <input type="text" placeholder="Digite a senha novamente" id="ipt_confirmarSenha">
            </div>
            
            <div class="campo">
                <label>Tipo de Usuario:</label>
                <select name="" id="ipt_tipoUsuario">
                    <option selected value="analista">Analista</option>
                    <option value="gestor">Gestor</option>
                </select>
            </div>
            <button onclick="criarConta()">Cadastrar Usuário</button>   

        </div>

    </div>

</body>

</html>

<script>

    const nomeUsuario = sessionStorage.getItem('NOME_USUARIO');
    
    if(nomeUsuario == undefined || nomeUsuario == null) {
        document.getElementById("nome_usuario").innerHTML = "Usuário";
    } else {
        document.getElementById("nome_usuario").innerHTML = nomeUsuario;
    }
    
    const tipoUsuario = sessionStorage.getItem('TIPO_USUARIO');

    if(tipoUsuario == "analista" || tipoUsuario == undefined || tipoUsuario == null) {
        document.getElementById("menuProdutos").style.display = "none";
        document.getElementById("menuSetores").style.display = "none";
        document.getElementById("menuContatos").style.display = "none";
        document.getElementById("menuCadastro").style.display = "none";
    }

    let listaCaracter = ["@","#","$","%","&","*","!","."]

    function criarConta() {
        let nome = ipt_nome.value;
        let email = ipt_email.value;
        let senha = ipt_senha.value;
        let confirmarSenha = ipt_confirmarSenha.value;
        let tipoUsuario = ipt_tipoUsuario.value;
        const idEmpresa = sessionStorage.getItem('ID_EMPRESA');



        let termina_com = email.endsWith('.com');
        let indice_arroba = email.indexOf('@');

        let temEspecial = false;

        for (let i = 0; i < listaCaracter.length; i++) {
            if (senha.includes(listaCaracter[i])) {
                temEspecial = true;
                break;
            }
        }

        if (
            nome == "" ||  email == "" || senha == "" || confirmarSenha == ""
        ) {
            alert("❌ Preencha todos os campos!");
            return;
        }
        else if (senha.length < 8) {
            alert("❌ A senha deve ter pelo menos 8 caracteres!");
            return;
        }
        else if (!temEspecial) {
            alert("❌ A senha precisa ter caractere especial");
            return;
        } 
        else if (indice_arroba == -1 || !termina_com) {
            alert("❌ Email inválido!");
            return;
        }
        else if (senha != confirmarSenha) {
            alert("❌ As senhas não coincidem!");
            return;
        }
        else {
            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nomeServer: nome,
                    emailServer: email,
                    senhaServer: senha,
                    tipoUsuarioServer: tipoUsuario,
                    idEmpresaServer: idEmpresa
                })
            })
            .then(function (resposta) {
                console.log("Resposta:", resposta);
                if(resposta.ok) {
                    alert("Cadastro realizado com sucesso!");
                }else {
                    alert("Erro ao realizar cadastro! Verifique as informações inseridas");
                }
            })
            .catch(function (erro) {
                console.log("Erro: ", erro);
                alert("Erro na comumincação com o servidor.")
            });
    }
    }
</script>
