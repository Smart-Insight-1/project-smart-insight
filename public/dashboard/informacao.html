<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Smart Insight</title>

    <link rel="stylesheet" href="../css/dashboardMenu.css">
    <link rel="stylesheet" href="../css/informacao.css">
    <link rel="stylesheet" href="../css/sair.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
</head>

<body onload="buscarInformacoesEmpresaLoja()">

    <div class="menu">
        <h2>Painel, Olá <span id="nome_usuario">*</span></h2>
        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li id="menuProdutos"><a href="produto.html">Produtos</a></li>
            <li id="menuSetores"><a href="setor.html">Setores</a></li>
            <li id="menuContatos"><a href="contato.html">Contatos</a></li>
            <li><strong><a href="informacao.html">Informações</a></strong></li>
            <li id="menuCadastro"><a href="cadastro.html">Cadastro Usuário</a></li>
            <button1 class="sairBotao"><a href="../index.html">SAIR</a></button1>
        </ul>
    </div>
    <div class="container-informacao">
        <div class="box">
            <h2>Informações da Empresa:</h2>
            <p>Razão Social Empresa: <span id="razao_social_empresa">-</span></p>
            <p>CNPJ: <span id="cnpj_empresa">-</span></p>
            <h2>Infomações da Loja:</h2>
            <p>Nome Loja: <span id="nome_loja"></span></p>
            <p>CNPJ: <span id="cnpj_loja">-</span></p>
            <p>Endereço: <span id="endereco_loja">-</span></p>
        </div>
    </div>
</body>
<script>

    const nomeUsuario = sessionStorage.getItem('NOME_USUARIO');
    
    if(nomeUsuario == undefined || nomeUsuario == null) {
        document.getElementById("nome_usuario").innerHTML = "Usuário";
    } else {
        document.getElementById("nome_usuario").innerHTML = nomeUsuario;
    }
    
    const tipoUsuario = sessionStorage.getItem('TIPO_USUARIO');

    if(tipoUsuario == "analista" || tipoUsuario == undefined || tipoUsuario == null) {
        document.getElementById("menuProdutos").style.display = "none";
        document.getElementById("menuSetores").style.display = "none";
        document.getElementById("menuContatos").style.display = "none";
        document.getElementById("menuCadastro").style.display = "none";
    }

    const idLoja = sessionStorage.getItem('ID_LOJA');

    function buscarInformacoesEmpresaLoja() {

        let razao_social_empresa = document.getElementById("razao_social_empresa");
        let cnpj_empresa = document.getElementById("cnpj_empresa");
        let nome_loja = document.getElementById("nome_loja");
        let cnpj_loja = document.getElementById("cnpj_loja");
        let endereco_loja = document.getElementById("endereco_loja");

        fetch(`/informacao/buscarInformacoesEmpresaLoja/${idLoja}`)
        .then((resposta) => {
            return resposta.json();
        }).then((dados) => {
            console.log('Dados: ', dados);
            razao_social_empresa.value = dados[0].razao_social;
            cnpj_empresa.value = dados[0].cnpj_empresa;
            nome_loja.value = dados[0].nome_loja;
            cnpj_loja.value = dados[0].cnpj_loja;
            endereco_loja.value = dados[0].endereco_loja;
        }).catch((err) => {
            console.log(err);
            console.log("\nHouve um erro ao buscar as informações! Erro: ", err);
        })
    }
    
</script>
