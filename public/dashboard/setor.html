    <div class="container-setor">

        <div class="lista-setores">

            <h2>Setores Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Setor</th>
                        <th>Descrição</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>Masculino</td>
                        <td>Produtos masculinos</td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Feminino</td>

                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Lançamentos</td>
                        <td>Novos produtos</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <div class="box">

            <h2>Cadastrar Setor</h2>

            <div class="campo">
                <label>Nome do Setor</label>
                <input type="text" placeholder="Digite o nome do setor">
            </div>

            <div class="campo">
                <label>Descrição</label>
                <input type="text" placeholder="Digite a descrição">
            </div>

            <button>Cadastrar Setor</button>

        </div>
