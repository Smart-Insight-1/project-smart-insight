<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BobIA</title>
  <link rel="stylesheet" href="css/helpdesk.css">
  <link rel="stylesheet" href="css/headerFooter.css">
</head>

<body>

  <div class="container-bobia" id="container">
    <h1>Bem-vindo ao BobIA, agente de suporte Smart Insight!</h1>
    <textarea id="pergunta" type="text" placeholder="Digite a pergunta..."></textarea>
    <br><br>
    <button onclick="gerarResposta()">Gerar Resposta</button>
    <h3>Resposta da IA:</h3>
    <div id="resposta"></div>
  </div>
</body>

</html>
  <script>

    async function gerarResposta() {
      const pergunta = document.getElementById('pergunta').value;

      const response = await fetch('/perguntar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ pergunta })
      });

      const data = await response.json();

      resposta.style.display = 'block';
      document.getElementById('resposta').innerText = data.resultado;
    }

  </script>
